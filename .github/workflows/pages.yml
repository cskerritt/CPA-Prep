name: Deploy to GitHub Pages

# Deploys the whole repo as a static site so the study app is reachable at
#   https://<user>.github.io/CPA-Prep/        (redirects to /app/)
#   https://<user>.github.io/CPA-Prep/app/
# Runs on pushes to the default branch or manually.
# Note: this repo's default branch is currently claude/cpa-exam-roadmap-ghkEY
# (the repo was created empty). If a main branch is created later and made
# default, the main trigger below covers it.

on:
  push:
    branches:
      - main
      - claude/cpa-exam-roadmap-ghkEY
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
